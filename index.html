<title>雪夜圣诞树</title>
<meta name="description" content="WebGL 粒子圣诞树。拖动旋转、捏合缩放、双击点灯、长按烟花、摄像头手势散开与收拢。">
<meta name="theme-color" content="#04060b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500&display=swap">

<style>
:root{
  color-scheme: dark;
  --ink:#04060b;
  --gold:#f6c97a;
  --text:#efe9dc;
  --muted:rgba(239,233,220,.56);
  --font-display:"Cinzel","Songti SC","Times New Roman",serif;
  --font-ui:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-ui);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

#gl{
  position:fixed;
  inset:0;
  display:block;
  touch-action:none;
  cursor:grab;
}
#gl:active{ cursor:grabbing; }

.veil{
  position:fixed; inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(4,6,11,.82) 0%, rgba(4,6,11,.34) 11%, rgba(4,6,11,0) 20%),
    radial-gradient(130% 95% at 50% 40%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 100%);
}

.greet{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom, 0px) + clamp(26px, 5vh, 54px));
  transform:translateX(-50%);
  margin:0;
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(13px, 2.6vw, 21px);
  letter-spacing:.30em;
  text-indent:.30em;
  color:var(--gold);
  opacity:.9;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 0 26px rgba(246,201,122,.42), 0 0 60px rgba(246,201,122,.16);
}

.hint{
  position:fixed;
  left:0; right:0;
  top:calc(env(safe-area-inset-top, 0px) + 20px);
  margin:0;
  padding-inline:16px;
  text-align:center;
  font-size:11px;
  line-height:1.9;
  letter-spacing:.13em;
  color:var(--muted);
  pointer-events:none;
  text-wrap:balance;
  transition:opacity 1.1s ease;
}
.hint.tame{ opacity:.18; }
@media (max-width:520px){ .hint{ font-size:10px; letter-spacing:.06em; } }

.handBtn{
  position:fixed;
  left:max(16px, env(safe-area-inset-left, 0px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index:5;
  font-family:var(--font-ui);
  font-size:12px;
  letter-spacing:.08em;
  color:var(--muted);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(246,201,122,.22);
  border-radius:999px;
  padding:9px 15px;
  cursor:pointer;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  transition:color .3s, border-color .3s;
}
.handBtn:hover{ color:var(--gold); border-color:rgba(246,201,122,.52); }
.handBtn:disabled{ opacity:.55; cursor:default; }
.handBtn.on{ color:var(--gold); border-color:rgba(246,201,122,.5); }

#cam{
  position:fixed;
  left:max(16px, env(safe-area-inset-left, 0px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 60px);
  width:132px; height:99px;
  object-fit:cover;
  border-radius:10px;
  transform:scaleX(-1);
  border:1px solid rgba(246,201,122,.25);
  opacity:0;
  pointer-events:none;
  transition:opacity .5s;
  background:#000;
  z-index:4;
}
#cam.on{ opacity:.55; }

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom, 0px) + 104px);
  max-width:min(92vw, 420px);
  padding:8px 14px;
  font-size:12px;
  line-height:1.6;
  text-align:center;
  color:var(--muted);
  background:rgba(10,15,25,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  opacity:0;
  transition:opacity .4s;
  pointer-events:none;
  z-index:6;
}
.toast.on{ opacity:1; }

@media (prefers-reduced-motion: reduce){
  .hint{ transition:none; }
}
</style>

<div class="veil" aria-hidden="true"></div>
<h1 class="greet">Merry Christmas</h1>
<p class="hint" id="hint">拖动旋转 &nbsp;·&nbsp; 捏合远近 &nbsp;·&nbsp; 双击点灯 &nbsp;·&nbsp; 长按烟花</p>

<button class="handBtn" id="handBtn" type="button">手势控制</button>
<video id="cam" playsinline muted></video>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

/* ---------------------------------------------------------------- 参数 */
const TH = 520;          // 树高（世界单位）
const TR = 186;          // 树底半径
const STAR_Y = TH / 2 + 62;
const FOV = 40;

const LOW = matchMedia("(max-width: 720px)").matches || (navigator.hardwareConcurrency || 8) <= 4;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const PAL = {
  gold:     [0.965, 0.788, 0.478],
  goldDeep: [0.722, 0.525, 0.259],
  pine:     [0.455, 0.839, 0.631],
  berry:    [1.000, 0.490, 0.431],
  snow:     [0.859, 0.906, 1.000],
};

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const TAU = Math.PI * 2;

/* ---------------------------------------------------------------- 场景 */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 6000);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch (e) {
  document.body.innerHTML = '<p style="color:#efe9dc;font:14px system-ui;padding:40px">这个浏览器打不开 WebGL。</p>';
  throw e;
}
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 2.0;
renderer.domElement.id = "gl";
// 必须插到最前面：后面的 veil / 文字都是 position:fixed、z-index 自动，
// 画布后插入就会盖住它们
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const group = new THREE.Group();
scene.add(group);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.45, 0.35);
composer.addPass(bloom);

/* ---------------------------------------------------------------- 着色器 */
const VERT = `
uniform float uTime, uLight, uScatter, uIntro, uPixelRatio, uScale;
attribute vec3 aColor;
attribute vec3 aScatter;
attribute vec3 aStart;
attribute float aSize, aPhase, aSpeed, aDelay;
varying vec3 vColor;
varying float vAlpha;
void main(){
  float k = clamp((uScatter - aDelay * 0.35) / 0.65, 0.0, 1.0);
  vec3 p = mix(position, aScatter, k);
  p = mix(aStart, p, uIntro);
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  float tw = 0.76 + 0.24 * sin(uTime * aSpeed + aPhase);
  gl_PointSize = aSize * uPixelRatio * uScale / max(1.0, -mv.z) * (1.0 + 0.10 * k);
  vAlpha = tw * uLight;
  vColor = aColor;
}`;

const FRAG = `
varying vec3 vColor;
varying float vAlpha;
void main(){
  vec2 c = gl_PointCoord - vec2(0.5);
  float d = length(c);
  if (d > 0.5) discard;
  float core = smoothstep(0.5, 0.04, d);
  float glow = pow(max(0.0, 1.0 - d * 2.0), 2.4);
  float a = (core * 0.55 + glow * 0.28) * vAlpha;
  gl_FragColor = vec4(vColor, a);
}`;

const uniforms = {
  uTime: { value: 0 },
  uLight: { value: 1 },
  uScatter: { value: 0 },
  uIntro: { value: REDUCED ? 1 : 0 },
  uPixelRatio: { value: 1 },
  uScale: { value: 1000 },
};

const treeMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: VERT,
  fragmentShader: FRAG,
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
});

/* ---------------------------------------------------------------- 点云 */
function coneRadius(h) {
  const base = Math.pow(1 - h, 0.82);
  const tiers = 0.95 + 0.055 * Math.abs(Math.sin(h * Math.PI * 7.5));
  return TR * base * tiers;
}

function buildTree() {
  const body = [], garland = [], star = [], ground = [], bg = [];

  const N_BODY = LOW ? 2000 : 4200;
  for (let i = 0; i < N_BODY; i++) {
    const h = Math.pow(Math.random(), 0.74);
    const rMax = coneRadius(h);
    const onArm = Math.random() < 0.34;
    const a = onArm
      ? h * 18.0 + (Math.random() * 2 - 1) * 0.55
      : Math.random() * TAU;
    const rr = onArm ? rMax * rnd(0.86, 1.0) : rMax * Math.sqrt(rnd(0.28, 1.0));
    const p = {
      x: Math.cos(a) * rr,
      y: -TH / 2 + h * TH,
      z: Math.sin(a) * rr,
      size: rnd(2.0, 3.4),
      phase: Math.random() * TAU,
      speed: rnd(0.6, 2.0),
    };
    const roll = Math.random();
    if (roll < 0.055) { p.c = "gold"; p.size *= 1.25; }
    else if (roll < 0.085) { p.c = "berry"; p.size *= 1.2; }
    else if (roll < 0.13) { p.c = "snow"; }
    else { p.c = "pine"; }
    body.push(p);
  }

  const N_GAR = LOW ? 420 : 900;
  for (let i = 0; i < N_GAR; i++) {
    const k = i % 2;
    const t = Math.floor(i / 2) / (N_GAR / 2);
    const h = clamp(t + rnd(-0.035, 0.035), 0, 1);
    const a = h * TAU * 5.5 + k * Math.PI + rnd(-0.14, 0.14);
    const rr = coneRadius(h) * rnd(0.55, 0.94) + 1.0;
    garland.push({
      x: Math.cos(a) * rr,
      y: -TH / 2 + h * TH,
      z: Math.sin(a) * rr,
      size: rnd(2.8, 4.4),
      phase: Math.random() * TAU,
      speed: rnd(1.2, 2.8),
      c: Math.random() < 0.52 ? "gold" : (Math.random() < 0.55 ? "berry" : "snow"),
    });
  }

  const v = [];
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const r = (i % 2 === 0) ? 40 : 15;
    v.push([Math.cos(ang) * r, Math.sin(ang) * r]);
  }
  const N_STAR = LOW ? 240 : 480;
  for (let i = 0; i < N_STAR; i++) {
    const k = (Math.random() * 10) | 0;
    const a = v[k], b = v[(k + 1) % 10];
    const t = Math.random();
    star.push({
      x: a[0] + (b[0] - a[0]) * t + rnd(-1.5, 1.5),
      y: STAR_Y + (a[1] + (b[1] - a[1]) * t) + rnd(-1.5, 1.5),
      z: rnd(-4, 4),
      size: rnd(2.6, 4.4),
      phase: Math.random() * TAU,
      speed: rnd(0.8, 2.2),
      c: Math.random() < 0.62 ? "gold" : "snow",
    });
  }

  for (let i = 0; i < (LOW ? 260 : 520); i++) {
    const a = Math.random() * TAU;
    const r = rnd(TR * 0.7, TR * 1.35);
    ground.push({
      x: Math.cos(a) * r,
      y: -TH / 2 + rnd(-4, 4),
      z: Math.sin(a) * r * 0.72,
      size: rnd(1.6, 2.8),
      phase: Math.random() * TAU,
      speed: rnd(0.3, 1.0),
      c: "goldDeep",
    });
  }

  for (let i = 0; i < (LOW ? 220 : 480); i++) {
    bg.push({
      x: rnd(-900, 900),
      y: rnd(-600, 900),
      z: rnd(-1200, 400),
      size: rnd(1.2, 2.2),
      phase: Math.random() * TAU,
      speed: rnd(0.2, 0.9),
      c: "snow",
    });
  }

  // 散开目标 + 入场起点 + 延迟
  for (const arr of [body, garland, star, ground]) {
    for (const p of arr) {
      const rr2 = rnd(90, 340);
      const u = Math.random() * 2 - 1;
      const th = Math.random() * TAU;
      const sq = Math.sqrt(1 - u * u);
      p.sx = p.x * 0.35 + Math.cos(th) * sq * rr2;
      p.sy = p.y * 0.45 + u * rr2 * 1.15;
      p.sz = p.z * 0.35 + Math.sin(th) * sq * rr2;

      const m = rnd(1.4, 2.6);
      p.ox = p.x * m + rnd(-60, 60);
      p.oy = p.y * m + rnd(-60, 60);
      p.oz = p.z * m + rnd(-60, 60);

      p.delay = Math.random() * 0.6;
    }
  }
  for (const p of bg) {
    p.ox = p.x; p.oy = p.y; p.oz = p.z;
    p.sx = p.x; p.sy = p.y; p.sz = p.z;   // 远景星不参与散开，但不能留 undefined
    p.delay = 0;
  }

  return { body, garland, star, ground, bg };
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pointsFrom(list) {
  const n = list.length;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const sca = new Float32Array(n * 3);
  const sta = new Float32Array(n * 3);
  const siz = new Float32Array(n);
  const pha = new Float32Array(n);
  const spd = new Float32Array(n);
  const dly = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const p = list[i];
    pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
    sca[i * 3] = p.sx; sca[i * 3 + 1] = p.sy; sca[i * 3 + 2] = p.sz;
    sta[i * 3] = p.ox; sta[i * 3 + 1] = p.oy; sta[i * 3 + 2] = p.oz;
    const c = PAL[p.c];
    col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
    siz[i] = p.size; pha[i] = p.phase; spd[i] = p.speed; dly[i] = p.delay;
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("aScatter", new THREE.BufferAttribute(sca, 3));
  g.setAttribute("aStart", new THREE.BufferAttribute(sta, 3));
  g.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
  g.setAttribute("aSize", new THREE.BufferAttribute(siz, 1));
  g.setAttribute("aPhase", new THREE.BufferAttribute(pha, 1));
  g.setAttribute("aSpeed", new THREE.BufferAttribute(spd, 1));
  g.setAttribute("aDelay", new THREE.BufferAttribute(dly, 1));
  return new THREE.Points(g, treeMat);
}

const tree = buildTree();
const parts = {};
for (const key of ["body", "garland", "star", "ground", "bg"]) {
  shuffle(tree[key]);
  const pts = pointsFrom(tree[key]);
  pts.frustumCulled = false;
  parts[key] = pts;
  group.add(pts);
}
const baseCount = {};
for (const key in parts) baseCount[key] = parts[key].geometry.attributes.position.count;

/* ---------------------------------------------------------------- 雪 */
const SNOW_N = LOW ? 260 : 460;
const snowPos = new Float32Array(SNOW_N * 3);
const snowSiz = new Float32Array(SNOW_N);
const snowPha = new Float32Array(SNOW_N);
const snowSpd = new Float32Array(SNOW_N);
const snowVel = new Float32Array(SNOW_N);
for (let i = 0; i < SNOW_N; i++) {
  snowPos[i * 3] = rnd(-620, 620);
  snowPos[i * 3 + 1] = rnd(-320, 680);
  snowPos[i * 3 + 2] = rnd(-500, 500);
  snowSiz[i] = rnd(1.8, 3.2);
  snowPha[i] = Math.random() * TAU;
  snowSpd[i] = rnd(0.4, 1.4);
  snowVel[i] = rnd(18, 46);
}
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
snowGeo.setAttribute("aSize", new THREE.BufferAttribute(snowSiz, 1));
snowGeo.setAttribute("aPhase", new THREE.BufferAttribute(snowPha, 1));
snowGeo.setAttribute("aSpeed", new THREE.BufferAttribute(snowSpd, 1));
const snowMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    uniform float uTime, uLight, uPixelRatio, uScale;
    attribute float aSize, aPhase, aSpeed;
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPixelRatio * uScale / max(1.0, -mv.z);
      float tw = 0.55 + 0.45 * sin(uTime * aSpeed + aPhase);
      vAlpha = tw * 0.32 * uLight;
      vColor = vec3(0.859, 0.906, 1.0);
    }`,
  fragmentShader: FRAG,
  transparent: true, depthWrite: false, depthTest: false,
  blending: THREE.AdditiveBlending,
});
const snow = new THREE.Points(snowGeo, snowMat);
snow.frustumCulled = false;
scene.add(snow);

/* ---------------------------------------------------------------- 烟花 */
const SPARK_N = 420;
const sparkPos = new Float32Array(SPARK_N * 3);
const sparkCol = new Float32Array(SPARK_N * 3);
const sparkSiz = new Float32Array(SPARK_N);
const sparkAlpha = new Float32Array(SPARK_N);
const sparkState = [];
for (let i = 0; i < SPARK_N; i++) sparkState.push({ alive: false, vx: 0, vy: 0, life: 0, decay: 1 });
let sparkCursor = 0;

const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute("aColor", new THREE.BufferAttribute(sparkCol, 3));
sparkGeo.setAttribute("aSize", new THREE.BufferAttribute(sparkSiz, 1));
sparkGeo.setAttribute("aAlpha", new THREE.BufferAttribute(sparkAlpha, 1));
const sparkMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    uniform float uPixelRatio, uScale;
    attribute vec3 aColor;
    attribute float aSize, aAlpha;
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPixelRatio * uScale / max(1.0, -mv.z);
      vAlpha = aAlpha;
      vColor = aColor;
    }`,
  fragmentShader: FRAG,
  transparent: true, depthWrite: false, depthTest: false,
  blending: THREE.AdditiveBlending,
});
const sparks = new THREE.Points(sparkGeo, sparkMat);
sparks.frustumCulled = false;
scene.add(sparks);

function burst(px, py, n, power) {
  const tan = Math.tan(FOV * Math.PI / 360);
  const visH = 2 * tan * camera.position.z;
  const visW = visH * (window.innerWidth / window.innerHeight);
  const wx = (px / window.innerWidth - 0.5) * visW;
  const wy = (0.5 - py / window.innerHeight) * visH;

  for (let i = 0; i < n; i++) {
    const s = sparkState[sparkCursor];
    const idx = sparkCursor;
    sparkCursor = (sparkCursor + 1) % SPARK_N;
    const a = Math.random() * TAU;
    const v = power * (0.25 + Math.random() * 0.95);
    s.alive = true;
    s.vx = Math.cos(a) * v;
    s.vy = Math.sin(a) * v - power * 0.12;
    s.life = 1;
    s.decay = rnd(0.9, 1.8);
    sparkPos[idx * 3] = wx;
    sparkPos[idx * 3 + 1] = wy;
    sparkPos[idx * 3 + 2] = 0;
    const c = PAL[Math.random() < 0.5 ? "gold" : (Math.random() < 0.6 ? "berry" : "snow")];
    sparkCol[idx * 3] = c[0]; sparkCol[idx * 3 + 1] = c[1]; sparkCol[idx * 3 + 2] = c[2];
    sparkSiz[idx] = rnd(3, 6);
    sparkAlpha[idx] = 1;
  }
}

/* ---------------------------------------------------------------- 尺寸 */
let W = 1, H = 1, baseDist = 1200, zoom = 1, qScale = 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const aspect = W / H;
  const tan = Math.tan(FOV * Math.PI / 360);

  // 竖屏按宽度取距离，横屏按高度取，两边都不裁切
  const dH = 820 / (2 * tan);
  const dW = 470 / (2 * tan * aspect);
  baseDist = Math.max(dH, dW);

  camera.aspect = aspect;
  camera.position.z = baseDist / zoom;
  camera.updateProjectionMatrix();

  // 上限放到 3：浏览器整页放大时 devicePixelRatio 会变 4、6，
  // 卡在 2 就又会糊。WebGL 这点填充量撑得住。
  const pr = Math.min(window.devicePixelRatio || 1, 3);
  renderer.setPixelRatio(pr);
  renderer.setSize(W, H);
  composer.setPixelRatio(pr);
  composer.setSize(W, H);

  uniforms.uPixelRatio.value = pr;
  uniforms.uScale.value = (H / 2) / tan;
}
window.addEventListener("resize", resize);

/* ---------------------------------------------------------------- 交互 */
let yaw = 0, pitch = 0.10, spin = 0;
let light = 1, lightTarget = 1;
let scatterTarget = 0, scatterK = 0;
let introT = REDUCED ? 1 : 0;
const AUTO_SPIN = REDUCED ? 0 : 0.055;

const ptrs = new Map();
let dragging = false, lastX = 0, lastY = 0, moved = 0, downAt = 0;
let pinchD0 = 0, zoom0 = 1, pinchA0 = 0;
let longTimer = 0;
let lastTap = 0, lastTapX = 0, lastTapY = 0;

const el = renderer.domElement;

function ptrArr() { return Array.from(ptrs.values()); }
function pinchDist() { const a = ptrArr(); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
function pinchAngle() { const a = ptrArr(); return Math.atan2(a[1].y - a[0].y, a[1].x - a[0].x); }

function toggleLight() { lightTarget = lightTarget > 0.7 ? 0.34 : 1.0; }

function starScreen() {
  const v = new THREE.Vector3(0, STAR_Y, 0).applyMatrix4(group.matrixWorld).project(camera);
  return [ (v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H ];
}

el.addEventListener("pointerdown", (e) => {
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (ptrs.size === 1) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    moved = 0; downAt = performance.now(); spin = 0;
    clearTimeout(longTimer);
    longTimer = setTimeout(() => {
      if (moved < 10) { const s = starScreen(); burst(s[0], s[1], 110, 260); }
    }, 620);
  } else if (ptrs.size === 2) {
    clearTimeout(longTimer);
    pinchD0 = pinchDist(); zoom0 = zoom; pinchA0 = pinchAngle();
  }
});

el.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (ptrs.size === 1 && dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx * 0.0078;
    pitch = clamp(pitch + dy * 0.0042, -0.42, 0.62);
    spin = dx * 0.0078 * 9;
    lastX = e.clientX; lastY = e.clientY;
    if (moved > 12) clearTimeout(longTimer);
  } else if (ptrs.size === 2) {
    const d = pinchDist();
    if (pinchD0 > 0) zoom = clamp(zoom0 * (d / pinchD0), 0.55, 2.7);
    const a = pinchAngle();
    let da = a - pinchA0;
    if (da > Math.PI) da -= TAU;
    if (da < -Math.PI) da += TAU;
    yaw += da * 0.55;
    pinchA0 = a;
  }
});

function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  clearTimeout(longTimer);

  if (ptrs.size === 0) {
    dragging = false;
    const held = performance.now() - downAt;
    if (moved < 10 && held < 300) {
      burst(e.clientX, e.clientY, 22, 120);
      const now = performance.now();
      if (now - lastTap < 330 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40) {
        toggleLight(); lastTap = 0;
      } else {
        lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY;
      }
    }
  }
  if (ptrs.size < 2) pinchD0 = 0;
}
el.addEventListener("pointerup", endPointer);
el.addEventListener("pointercancel", endPointer);

el.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom = clamp(zoom * (1 - e.deltaY * 0.0011), 0.55, 2.7);
}, { passive: false });

el.addEventListener("contextmenu", (e) => e.preventDefault());

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft")  { yaw -= 0.06; spin = -0.5; }
  if (e.key === "ArrowRight") { yaw += 0.06; spin = 0.5; }
  if (e.key === "ArrowUp")    pitch = clamp(pitch + 0.05, -0.42, 0.62);
  if (e.key === "ArrowDown")  pitch = clamp(pitch - 0.05, -0.42, 0.62);
  if (e.key === "+" || e.key === "=") zoom = clamp(zoom * 1.08, 0.55, 2.7);
  if (e.key === "-" || e.key === "_") zoom = clamp(zoom / 1.08, 0.55, 2.7);
  if (e.key === " ") { e.preventDefault(); const s = starScreen(); burst(s[0], s[1], 120, 280); }
  if (e.key === "s" || e.key === "S") scatterTarget = scatterTarget > 0.5 ? 0 : 1;
});

/* ---------------------------------------------------------------- 手势 */
const handBtn = document.getElementById("handBtn");
const cam = document.getElementById("cam");
const toastEl = document.getElementById("toast");

const HAND = { ready: false, on: false, stream: null, landmarker: null,
  lastVideoTime: -1, lastDetect: 0, raf: 0, mode: "idle", base: null, lastPinch: 0 };

let toastTimer = 0;
function toast(msg, ms) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), ms || 3600);
}

function withTimeout(p, ms, label) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label)), ms))]);
}

async function enableHands(auto) {
  if (location.protocol === "file:") {
    toast("摄像头只在 http(s) 下可用。", 5000); return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("这个浏览器不支持摄像头。"); return;
  }
  handBtn.disabled = true;
  handBtn.textContent = "打开摄像头…";
  try {
    const stream = await withTimeout(navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: LOW ? 320 : 640 }, height: { ideal: LOW ? 240 : 480 } },
      audio: false,
    }), 12000, "camera-timeout");
    HAND.stream = stream;
    cam.srcObject = stream;
    await cam.play();
    cam.classList.add("on");

    handBtn.textContent = "加载手势模型…";
    const mod = await withTimeout(
      import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"),
      20000, "model-timeout");
    const { FilesetResolver, HandLandmarker } = mod;
    const vision = await withTimeout(
      FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"),
      20000, "model-timeout");

    const opts = {
      baseOptions: { modelAssetPath: "hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 1,
    };
    try {
      HAND.landmarker = await withTimeout(HandLandmarker.createFromOptions(vision, opts), 30000, "model-timeout");
    } catch (e) {
      opts.baseOptions.delegate = "CPU";
      HAND.landmarker = await withTimeout(HandLandmarker.createFromOptions(vision, opts), 30000, "model-timeout");
    }

    HAND.ready = true; HAND.on = true;
    handBtn.disabled = false;
    handBtn.classList.add("on");
    handBtn.textContent = "手势已开启";
    if (!auto) toast("张开手掌散开 · 握拳收拢 · 拇指食指捏合点灯", 4600);
    detectLoop();
  } catch (err) {
    console.error(err);
    handBtn.disabled = false;
    handBtn.textContent = "手势控制";
    stopHands();
    if (!auto) {
      const m = err && err.message;
      if (m === "camera-timeout") toast("摄像头没有响应。看看是不是被别的程序占用了。");
      else if (m === "model-timeout") toast("手势模型加载超时。检查网络后再点一次。");
      else if (err && err.name === "NotAllowedError") toast("摄像头被拒绝了。允许权限后再点一次。");
      else if (err && err.name === "NotFoundError") toast("没有找到摄像头。");
      else toast("手势没启动成功。鼠标和触摸照常可用。");
    }
  }
}

function stopHands() {
  HAND.on = false; HAND.mode = "idle"; HAND.base = null;
  if (HAND.raf) cancelAnimationFrame(HAND.raf);
  HAND.raf = 0;
  if (HAND.stream) { HAND.stream.getTracks().forEach(t => t.stop()); HAND.stream = null; }
  cam.classList.remove("on");
  cam.srcObject = null;
  handBtn.classList.remove("on");
}

function detectLoop() {
  if (!HAND.on) return;
  const gap = LOW ? 80 : 45;
  const t = performance.now();
  if (cam.readyState >= 2 && t - HAND.lastDetect >= gap && cam.currentTime !== HAND.lastVideoTime) {
    HAND.lastDetect = t;
    HAND.lastVideoTime = cam.currentTime;
    try { handleHand(HAND.landmarker.detectForVideo(cam, t)); } catch (e) {}
  }
  HAND.raf = requestAnimationFrame(detectLoop);
}

function handleHand(res) {
  const lm = res && res.landmarks && res.landmarks[0];
  if (!lm) { HAND.mode = "idle"; HAND.base = null; scatterTarget = 0; return; }

  const wrist = lm[0], mcp = lm[9];
  const scale = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y) || 1e-3;

  let spread = 0;
  for (const i of [8, 12, 16, 20]) spread += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y);
  const open = (spread / 4) / scale;

  const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / scale;

  const hx = (0.5 - mcp.x) * 2;
  const hy = (0.5 - mcp.y) * 2;

  if (pinch < 0.34 && open > 1.25 && performance.now() - HAND.lastPinch > 700) {
    HAND.lastPinch = performance.now();
    toggleLight();
  }

  if (open > 1.62) {
    scatterTarget = 1;
    if (HAND.mode !== "steer") {
      HAND.mode = "steer";
      HAND.base = { yaw, pitch, hx, hy };
    } else {
      yaw = HAND.base.yaw + (hx - HAND.base.hx) * 2.4;
      pitch = clamp(HAND.base.pitch + (hy - HAND.base.hy) * 0.9, -0.42, 0.62);
    }
    spin = 0;
  } else if (open < 1.24) {
    scatterTarget = 0;
    HAND.mode = "idle";
    HAND.base = null;
  }
}

handBtn.addEventListener("click", () => {
  if (!HAND.ready) { enableHands(false); return; }
  if (HAND.on) { stopHands(); handBtn.textContent = "手势控制"; }
  else {
    HAND.on = true; cam.classList.add("on"); handBtn.classList.add("on");
    handBtn.textContent = "手势已开启"; detectLoop();
  }
});

/* ---------------------------------------------------------------- 循环 */
const clock = new THREE.Clock();
let frameAcc = 0, frameN = 0, tick = 0;

function animate() {
  requestAnimationFrame(animate);

  if (LOW) { tick++; if (tick & 1) return; }

  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  if (!REDUCED && introT < 1) introT = Math.min(1, introT + dt / 1.9);

  if (!dragging) {
    yaw += (spin + AUTO_SPIN) * dt;
    spin *= Math.exp(-2.6 * dt);
  }
  light += (lightTarget - light) * Math.min(1, dt * 5);
  scatterK += (scatterTarget - scatterK) * Math.min(1, dt * 6);
  if (scatterK < 0.001) scatterK = 0;

  group.rotation.y = yaw;
  group.rotation.x = pitch;

  uniforms.uTime.value = t;
  uniforms.uLight.value = light;
  uniforms.uScatter.value = scatterK;
  uniforms.uIntro.value = introT;

  // 雪
  if (!REDUCED) {
    for (let i = 0; i < SNOW_N; i++) {
      snowPos[i * 3 + 1] -= snowVel[i] * dt;
      snowPos[i * 3] += Math.sin(t * 0.6 + snowPha[i]) * dt * 12;
      if (snowPos[i * 3 + 1] < -340) {
        snowPos[i * 3 + 1] = 700;
        snowPos[i * 3] = rnd(-620, 620);
      }
    }
    snowGeo.attributes.position.needsUpdate = true;
  }

  // 烟花
  let sparkDirty = false;
  for (let i = 0; i < SPARK_N; i++) {
    const s = sparkState[i];
    if (!s.alive) continue;
    sparkDirty = true;
    sparkPos[i * 3] += s.vx * dt;
    sparkPos[i * 3 + 1] += s.vy * dt;
    s.vy -= 140 * dt;
    s.vx *= Math.exp(-1.1 * dt);
    s.vy *= Math.exp(-0.5 * dt);
    s.life -= s.decay * dt;
    sparkAlpha[i] = Math.max(0, s.life);
    if (s.life <= 0) { s.alive = false; sparkAlpha[i] = 0; }
  }
  if (sparkDirty) {
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.aAlpha.needsUpdate = true;
  }

  camera.position.z = baseDist / zoom;

  // 自适应：掉帧就减少绘制粒子（均匀抽样，形状不变）
  frameAcc += dt; frameN++;
  if (frameN >= 45) {
    const avg = frameAcc / frameN;
    const target = LOW ? 1 / 30 : 1 / 60;
    if (avg > target * 1.35) qScale = Math.max(0.4, qScale - 0.1);
    else if (avg < target * 1.1) qScale = Math.min(1, qScale + 0.05);
    for (const key in parts) {
      parts[key].geometry.setDrawRange(0, Math.max(200, Math.floor(baseCount[key] * qScale)));
    }
    frameAcc = 0; frameN = 0;
  }

  composer.render();
}

/* ---------------------------------------------------------------- 启动 */
resize();
setTimeout(() => document.getElementById("hint").classList.add("tame"), 7200);

if (location.protocol !== "file:" && navigator.mediaDevices) {
  setTimeout(() => { if (!HAND.ready && !HAND.on) enableHands(true); }, 700);
}

animate();
</script>

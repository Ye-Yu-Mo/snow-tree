<title>雪夜圣诞树</title>
<meta name="description" content="一棵由粒子组成的圣诞树。拖动旋转，捏合远近，双击点灯，长按烟花。">
<meta name="theme-color" content="#04060b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500&display=swap">

<style>
/* ---------------------------------------------------------------
   设计方向：冬夜 / 单主题深色 — 近黑底、暖金灯、松绿、雪白
   字体：Cinzel（铭文感的大写，只用在问候语）+ Inter（界面）
   --------------------------------------------------------------- */
:root{
  color-scheme: dark;

  --ink:        #04060b;
  --ink-soft:   #0a0f19;
  --gold:       #f6c97a;
  --gold-deep:  #b9883f;
  --pine:       #74d6a1;
  --berry:      #ff7d6e;
  --snow:       #dbe7ff;
  --text:       #efe9dc;
  --muted:      rgba(239,233,220,.56);

  --font-display: "Cinzel", "Songti SC", "Times New Roman", serif;
  --font-ui: "Inter", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}

*{ box-sizing:border-box; }

html, body{ height:100%; }

body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-ui);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

#sky{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  cursor:grab;
  outline:none;
}
#sky:active{ cursor:grabbing; }
#sky:focus-visible{ outline:1px solid rgba(246,201,122,.5); outline-offset:-4px; }

/* 暗角 + 地面暖光，是一层静态玻璃，不是粒子 */
.veil{
  position:fixed; inset:0;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(4,6,11,.82) 0%, rgba(4,6,11,.34) 11%, rgba(4,6,11,0) 20%),
    radial-gradient(130% 95% at 50% 40%, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 100%),
    radial-gradient(58% 34% at 50% 103%, rgba(246,201,122,.13), rgba(246,201,122,0) 72%);
}

.greet{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom, 0px) + clamp(26px, 5vh, 54px));
  transform:translateX(-50%);
  margin:0;
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(13px, 2.6vw, 21px);
  letter-spacing:.30em;
  text-indent:.30em;
  color:var(--gold);
  opacity:.9;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 0 26px rgba(246,201,122,.42), 0 0 60px rgba(246,201,122,.16);
}

.hint{
  position:fixed;
  left:0;
  right:0;
  top:calc(env(safe-area-inset-top, 0px) + 20px);
  margin:0;
  padding-inline:16px;
  text-align:center;
  font-size:11px;
  line-height:1.9;
  letter-spacing:.13em;
  color:var(--muted);
  pointer-events:none;
  text-wrap:balance;
  transition:opacity 1.1s ease;
}
.hint.tame{ opacity:.18; }

@media (max-width: 520px){
  .hint{ font-size:10px; letter-spacing:.06em; }
}

@media (prefers-reduced-motion: reduce){
  .hint{ transition:none; }
}
/* ---- 可选：摄像头手势 ---- */
.handBtn{
  position:fixed;
  left:max(16px, env(safe-area-inset-left, 0px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index:5;
  font-family:var(--font-ui);
  font-size:12px;
  letter-spacing:.08em;
  color:var(--muted);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(246,201,122,.22);
  border-radius:999px;
  padding:9px 15px;
  cursor:pointer;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  transition:color .3s, border-color .3s, background .3s;
}
.handBtn:hover{ color:var(--gold); border-color:rgba(246,201,122,.52); }
.handBtn:disabled{ opacity:.55; cursor:default; }
.handBtn.on{ color:var(--gold); border-color:rgba(246,201,122,.5); }

#cam{
  position:fixed;
  left:max(16px, env(safe-area-inset-left, 0px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 60px);
  width:132px; height:99px;
  object-fit:cover;
  border-radius:10px;
  transform:scaleX(-1);
  border:1px solid rgba(246,201,122,.25);
  opacity:0;
  pointer-events:none;
  transition:opacity .5s;
  background:#000;
  z-index:4;
}
#cam.on{ opacity:.55; }

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom, 0px) + 104px);
  max-width:min(92vw, 420px);
  padding:8px 14px;
  font-size:12px;
  line-height:1.6;
  text-align:center;
  color:var(--muted);
  background:rgba(10,15,25,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  opacity:0;
  transition:opacity .4s;
  pointer-events:none;
  z-index:6;
}
.toast.on{ opacity:1; }

</style>

<canvas id="sky" tabindex="0" aria-label="一棵粒子组成的圣诞树。拖动旋转，滚轮或双指捏合缩放，双击点灯，长按放烟花。"></canvas>
<div class="veil" aria-hidden="true"></div>

<h1 class="greet">Merry Christmas</h1>

<p class="hint" id="hint">拖动旋转 &nbsp;·&nbsp; 捏合远近 &nbsp;·&nbsp; 双击点灯 &nbsp;·&nbsp; 长按烟花</p>

<button class="handBtn" id="handBtn" type="button">手势控制</button>
<video id="cam" playsinline muted></video>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- 可改
  // 问候语在这两处：上面的 <h1 class="greet"> 里改文字即可。
  // 想要别的语言/名字，直接改那一行。

  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d", { alpha: false });
  const hint = document.getElementById("hint");

  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SMALL = window.matchMedia("(max-width: 720px)").matches;
  const LOW = SMALL || (navigator.hardwareConcurrency || 8) <= 4;
  const SPRITE = LOW ? 32 : 64;

  let W = 0, H = 0, DPR = 1;
  let CX = 0, CY = 0;

  // ---------------------------------------------------------------- 几何
  // 世界坐标：y 向上，树底 y = -TH/2，树顶 y = +TH/2
  const TH = 520;          // 树高
  const TR = 186;          // 树底半径
  const STAR_Y = TH / 2 + 64;

  let focal = 800, camZ = 940;

  // ---------------------------------------------------------------- 调色
  const PAL = {
    gold:     [246, 201, 122],
    goldDeep: [184, 134, 66],
    pine:     [116, 214, 161],
    berry:    [255, 125, 110],
    snow:     [219, 231, 255],
  };
  const SP = ["gold", "goldDeep", "pine", "berry", "snow"];  // sprite 索引
  const sprites = {};

  function makeSprite(rgb) {
    const s = SPRITE;
    const cv = document.createElement("canvas");
    cv.width = cv.height = s;
    const c = cv.getContext("2d");
    const g = c.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0.0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`);
    g.addColorStop(0.30, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.62)`);
    g.addColorStop(0.62, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.18)`);
    g.addColorStop(1.0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
    c.fillStyle = g;
    c.fillRect(0, 0, s, s);
    return cv;
  }
  for (const k in PAL) sprites[k] = makeSprite(PAL[k]);

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  // ---------------------------------------------------------------- 点云
  const body = [], garland = [], star = [], snow = [], ground = [], bgStars = [];

  function coneRadius(h) {
    // h: 0 底 -> 1 顶
    const base = Math.pow(1 - h, 0.82);
    const tiers = 0.95 + 0.055 * Math.abs(Math.sin(h * Math.PI * 7.5)); // 树的分层起伏
    return TR * base * tiers;
  }

  function buildTree() {
    const N_BODY = LOW ? 2200 : 4800;
    const N_GAR = LOW ? 460 : 1000;

    // — 树体：大部分均匀铺满锥体，少部分沿螺旋成枝，才既有体积又有旋纹
    for (let i = 0; i < N_BODY; i++) {
      const h = Math.pow(Math.random(), 0.74);          // 底部更密
      const rMax = coneRadius(h);
      const onArm = Math.random() < 0.34;
      const a = onArm
        ? h * 18.0 + (Math.random() * 2 - 1) * 0.55
        : Math.random() * Math.PI * 2;
      const rr = onArm
        ? rMax * rnd(0.86, 1.0)
        : rMax * Math.sqrt(rnd(0.28, 1.0));
      const p = {
        x: Math.cos(a) * rr,
        y: -TH / 2 + h * TH,
        z: Math.sin(a) * rr,
        size: rnd(0.8, 1.6),
        phase: Math.random() * Math.PI * 2,
        speed: rnd(0.6, 2.0),
      };
      const roll = Math.random();
      if (roll < 0.055) { p.c = "gold"; p.size *= 1.25; }
      else if (roll < 0.085) { p.c = "berry"; p.size *= 1.2; }
      else if (roll < 0.13) { p.c = "snow"; }
      else { p.c = "pine"; }
      body.push(p);
    }

    // — 灯带：沿螺旋分布，但沉进树体内部（浮在表面会投影成一条条横线）
    for (let i = 0; i < N_GAR; i++) {
      const k = i % 2;
      const t = Math.floor(i / 2) / (N_GAR / 2);
      const h = clamp(t + rnd(-0.035, 0.035), 0, 1);
      const a = h * Math.PI * 2 * 5.5 + k * Math.PI + rnd(-0.14, 0.14);
      const rr = coneRadius(h) * rnd(0.55, 0.94) + 1.0;
      garland.push({
        x: Math.cos(a) * rr,
        y: -TH / 2 + h * TH,
        z: Math.sin(a) * rr,
        size: rnd(1.0, 1.9),
        phase: Math.random() * Math.PI * 2,
        speed: rnd(1.2, 2.8),
        c: Math.random() < 0.52 ? "gold" : (Math.random() < 0.55 ? "berry" : "snow"),
      });
    }

    // — 顶星：五角星轮廓采样
    const v = [];
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 5;
      const r = (i % 2 === 0) ? 40 : 15;
      v.push([Math.cos(ang) * r, Math.sin(ang) * r]);
    }
    const N_STAR = LOW ? 150 : 300;
    for (let i = 0; i < N_STAR; i++) {
      const k = (Math.random() * 10) | 0;
      const a = v[k], b = v[(k + 1) % 10];
      const t = Math.random();
      star.push({
        x: a[0] + (b[0] - a[0]) * t + rnd(-1.5, 1.5),
        y: STAR_Y + (a[1] + (b[1] - a[1]) * t) + rnd(-1.5, 1.5),
        z: rnd(-4, 4),
        size: rnd(1.4, 2.6),
        phase: Math.random() * Math.PI * 2,
        speed: rnd(0.8, 2.2),
        c: Math.random() < 0.62 ? "gold" : "snow",
      });
    }

    // — 地面：一圈很暗的金
    for (let i = 0; i < (LOW ? 120 : 200); i++) {
      const a = Math.random() * Math.PI * 2;
      const r = rnd(TR * 0.7, TR * 1.35);
      ground.push({
        x: Math.cos(a) * r,
        y: -TH / 2 + rnd(-4, 4),
        z: Math.sin(a) * r * 0.72,
        size: rnd(0.55, 1.05),
        phase: Math.random() * Math.PI * 2,
        speed: rnd(0.3, 1.0),
        c: "goldDeep",
      });
    }

    // — 雪
    const N_SNOW = LOW ? 180 : 460;
    for (let i = 0; i < N_SNOW; i++) {
      snow.push({
        x: rnd(-520, 520),
        y: rnd(-300, 620),
        z: rnd(-420, 420),
        size: rnd(0.9, 2.0),
        vy: rnd(18, 46),
        drift: rnd(0.3, 1.2),
        phase: Math.random() * Math.PI * 2,
        speed: rnd(0.4, 1.4),
        c: "snow",
      });
    }

    // — 远处固定的星
    const N_BG = LOW ? 90 : 280;
    for (let i = 0; i < N_BG; i++) {
      bgStars.push({
        x: rnd(-900, 900),
        y: rnd(-600, 900),
        z: rnd(-900, 900),
        size: rnd(0.5, 1.1),
        phase: Math.random() * Math.PI * 2,
        speed: rnd(0.2, 0.9),
        c: "snow",
      });
    }

    // — 入场：每个点从一个更远的位置收拢过来
    for (const arr of [body, garland, star, ground]) {
      for (const p of arr) {
        const m = rnd(1.4, 2.6);
        p.ox = p.x * m + rnd(-60, 60);
        p.oy = p.y * m + rnd(-60, 60);
        p.oz = p.z * m + rnd(-60, 60);
      }
    }
  }

  // ---------------------------------------------------------------- 状态
  let yaw = 0.0;
  let pitch = 0.10;
  let zoom = 1.0;
  let spin = 0;
  let light = 1.0, lightTarget = 1.0;
  let introT = REDUCED ? 1 : 0;
  let t0 = performance.now();
  let last = t0;
  let starX = 0, starY = 0;

  const AUTO_SPIN = REDUCED ? 0 : 0.055;

  // ---------------------------------------------------------------- 尺寸
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, LOW ? 1.5 : 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    CX = W / 2;
    CY = H * 0.50;

    focal = Math.min(W * 0.94, H * 0.76);
    camZ = focal * 1.18;
  }

  // ---------------------------------------------------------------- 投影
  function project(p, cyaw, syaw, cpit, spit) {
    const x1 = p.x * cyaw - p.z * syaw;
    const z1 = p.x * syaw + p.z * cyaw;
    const y1 = p.y * cpit - z1 * spit;
    const z2 = p.y * spit + z1 * cpit;
    const zc = z2 + camZ;
    if (zc < 40) return null;
    const s = focal / zc;
    return {
      x: CX + x1 * s * zoom,
      y: CY - y1 * s * zoom,
      s: s,
    };
  }

  // ---------------------------------------------------------------- 烟花
  const sparks = [];

  function burst(px, py, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = power * (0.25 + Math.random() * 0.95);
      sparks.push({
        x: px, y: py,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - power * 0.15,
        life: 1,
        decay: rnd(0.9, 1.8),
        size: rnd(1.0, 2.2),
        c: Math.random() < 0.5 ? "gold" : (Math.random() < 0.6 ? "berry" : "snow"),
      });
    }
  }

  // ---------------------------------------------------------------- 绘制
  const FLY = {
    body, garland, star, ground, bgStars,
  };

  function drawPoints(arr, cyaw, syaw, cpit, spit, time) {
    const k = introT;
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];

      let px = p.x, py = p.y, pz = p.z;
      if (k < 1 && p.ox !== undefined) {
        const ik = 1 - k;
        px = p.x * k + p.ox * ik;
        py = p.y * k + p.oy * ik;
        pz = p.z * k + p.oz * ik;
      }

      const x1 = px * cyaw - pz * syaw;
      const z1 = px * syaw + pz * cyaw;
      const y1 = py * cpit - z1 * spit;
      const z2 = py * spit + z1 * cpit;
      const zc = z2 + camZ;
      if (zc < 40) continue;

      const s = focal / zc;
      const X = CX + x1 * s * zoom;
      const Y = CY - y1 * s * zoom;
      if (X < -40 || X > W + 40 || Y < -40 || Y > H + 40) continue;

      const tw = 0.74 + 0.26 * Math.sin(time * p.speed + p.phase);
      const depth = clamp(s * 1.05, 0.22, 1.0);
      let alpha = tw * depth * light;
      const r = p.size * s * zoom * 2.2;
      if (alpha < 0.02 || r < 0.35) continue;
      if (alpha > 1) alpha = 1;

      ctx.globalAlpha = alpha;
      const spr = sprites[p.c];
      ctx.drawImage(spr, X - r, Y - r, r * 2, r * 2);
    }
  }

  let frameTick = 0;

  function frame(now) {
    // 手机上一次只画 30 帧：一半的绘制量，观感几乎没差别
    if (LOW) {
      frameTick++;
      if (frameTick & 1) { requestAnimationFrame(frame); return; }
    }

    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const time = (now - t0) / 1000;

    // 入场
    if (!REDUCED && introT < 1) introT = Math.min(1, introT + dt / 1.9);

    // 自转 + 惯性
    if (!dragging) {
      yaw += (spin + AUTO_SPIN) * dt;
      spin *= Math.exp(-2.6 * dt);
    }
    light += (lightTarget - light) * Math.min(1, dt * 5);

    const cyaw = Math.cos(yaw), syaw = Math.sin(yaw);
    const cpit = Math.cos(pitch), spit = Math.sin(pitch);

    // 背景：半透明覆盖 = 轻微拖尾
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(4,6,11,0.34)";
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    // 远星
    drawPoints(bgStars, cyaw, syaw, cpit, spit, time);

    // 雪
    const snowK = REDUCED ? 0.35 : 1;
    for (let i = 0; i < snow.length; i++) {
      const p = snow[i];
      if (!REDUCED) {
        p.y -= p.vy * dt * snowK;
        p.x += Math.sin(time * 0.6 + p.phase) * p.drift * dt * 12;
        if (p.y < -320) { p.y = 680; p.x = rnd(-520, 520); }
      }
      const pr = project(p, cyaw, syaw, cpit, spit);
      if (!pr) continue;
      const tw = 0.55 + 0.45 * Math.sin(time * p.speed + p.phase);
      const alpha = tw * 0.55 * light;
      const r = p.size * pr.s * zoom * 2.0;
      if (r < 0.3) continue;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprites.snow, pr.x - r, pr.y - r, r * 2, r * 2);
    }

    // 地面
    drawPoints(ground, cyaw, syaw, cpit, spit, time);

    // 树
    drawPoints(body, cyaw, syaw, cpit, spit, time);
    drawPoints(garland, cyaw, syaw, cpit, spit, time);

    // 星
    drawPoints(star, cyaw, syaw, cpit, spit, time);

    // 星的实心光晕
    const sp = project({ x: 0, y: STAR_Y, z: 0 }, cyaw, syaw, cpit, spit);
    if (sp) {
      starX = sp.x; starY = sp.y;
      const pulse = 0.78 + 0.22 * Math.sin(time * 1.6);
      const gr = 36 * sp.s * zoom * pulse;
      ctx.globalAlpha = 0.34 * light * pulse;
      ctx.drawImage(sprites.gold, starX - gr, starY - gr, gr * 2, gr * 2);
    }

    // 烟花
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 90 * dt;
      p.vx *= Math.exp(-1.1 * dt);
      p.vy *= Math.exp(-0.5 * dt);
      p.life -= p.decay * dt;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      const r = p.size * (1 + (1 - p.life) * 1.4) * 2.4;
      ctx.globalAlpha = clamp(p.life, 0, 1) * 0.95;
      ctx.drawImage(sprites[p.c], p.x - r, p.y - r, r * 2, r * 2);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- 手势
  const ptrs = new Map();
  let dragging = false;
  let lastX = 0, lastY = 0;
  let moved = 0;
  let downAt = 0;
  let pinchD0 = 0, zoom0 = 1;
  let pinchA0 = 0;
  let longTimer = 0;
  let lastTap = 0, lastTapX = 0, lastTapY = 0;

  function ptrArr() { return Array.from(ptrs.values()); }
  function pinchDist() {
    const a = ptrArr();
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  }
  function pinchAngle() {
    const a = ptrArr();
    return Math.atan2(a[1].y - a[0].y, a[1].x - a[0].x);
  }

  function toggleLight() {
    lightTarget = lightTarget > 0.7 ? 0.34 : 1.0;
  }

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (ptrs.size === 1) {
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
      moved = 0;
      downAt = performance.now();
      spin = 0;

      clearTimeout(longTimer);
      longTimer = setTimeout(() => {
        if (moved < 10) burst(starX, starY, 110, 210);
      }, 620);
    } else if (ptrs.size === 2) {
      clearTimeout(longTimer);
      pinchD0 = pinchDist();
      zoom0 = zoom;
      pinchA0 = pinchAngle();
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (ptrs.size === 1 && dragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      moved += Math.abs(dx) + Math.abs(dy);

      yaw += dx * 0.0078;
      pitch = clamp(pitch + dy * 0.0042, -0.42, 0.62);
      spin = dx * 0.0078 * 9;

      lastX = e.clientX; lastY = e.clientY;

      if (moved > 12) clearTimeout(longTimer);
    } else if (ptrs.size === 2) {
      const d = pinchDist();
      if (pinchD0 > 0) zoom = clamp(zoom0 * (d / pinchD0), 0.55, 2.7);

      const a = pinchAngle();
      let da = a - pinchA0;
      if (da > Math.PI) da -= Math.PI * 2;
      if (da < -Math.PI) da += Math.PI * 2;
      yaw += da * 0.55;
      pinchA0 = a;
    }
  });

  function endPointer(e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    clearTimeout(longTimer);

    if (ptrs.size === 0) {
      dragging = false;
      const held = performance.now() - downAt;
      if (moved < 10 && held < 300) {
        // 点按：小簇火花
        burst(e.clientX, e.clientY, 22, 96);

        // 双击检测
        const now = performance.now();
        if (now - lastTap < 330 &&
            Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40) {
          toggleLight();
          lastTap = 0;
        } else {
          lastTap = now;
          lastTapX = e.clientX;
          lastTapY = e.clientY;
        }
      }
    }
    if (ptrs.size < 2) { pinchD0 = 0; }
  }

  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoom = clamp(zoom * (1 - e.deltaY * 0.0011), 0.55, 2.7);
  }, { passive: false });

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft")  { yaw -= 0.06; spin = -0.5; }
    if (e.key === "ArrowRight") { yaw += 0.06; spin = 0.5; }
    if (e.key === "ArrowUp")    pitch = clamp(pitch + 0.05, -0.42, 0.62);
    if (e.key === "ArrowDown")  pitch = clamp(pitch - 0.05, -0.42, 0.62);
    if (e.key === "+" || e.key === "=") zoom = clamp(zoom * 1.08, 0.55, 2.7);
    if (e.key === "-" || e.key === "_") zoom = clamp(zoom / 1.08, 0.55, 2.7);
    if (e.key === " ") { e.preventDefault(); burst(starX, starY, 120, 230); }
  });

  window.addEventListener("resize", resize);

  document.addEventListener("visibilitychange", () => {
    last = performance.now();
  });

  // ---------------------------------------------------------------- 摄像头手势
  // 手势词汇参考 Ye-Yu-Mo/Christmas-tree，但修了它三处硬伤：
  //   1) facingMode:"user" —— 他们没写，手机上默认用后置摄像头，所以永远看不到手
  //   2) 用手指/手掌长度的比值做归一化 —— 他们用绝对距离阈值，手一伸远就判成握拳
  //   3) 坐标取镜像 —— 预览是镜像的，不镜像就会"手往右、树往左"

  const handBtn = document.getElementById("handBtn");
  const cam = document.getElementById("cam");
  const toastEl = document.getElementById("toast");

  const HAND = {
    ready: false, on: false, stream: null, landmarker: null,
    lastVideoTime: -1, lastDetect: 0, raf: 0, mode: "idle", base: null, lastPinch: 0,
  };

  let toastTimer = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), ms || 3600);
  }

  function withTimeout(p, ms, label) {
    return Promise.race([
      p,
      new Promise((_, reject) => setTimeout(() => reject(new Error(label)), ms)),
    ]);
  }

  async function enableHands(auto) {
    if (location.protocol === "file:") {
      toast("摄像头只在 http://localhost 下可用。在这个目录里运行 python3 -m http.server 8000，再打开 http://localhost:8000", 8000);
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast("这个浏览器不支持摄像头。");
      return;
    }

    handBtn.disabled = true;
    handBtn.textContent = "打开摄像头…";

    try {
      const stream = await withTimeout(navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: LOW ? 320 : 640 },
          height: { ideal: LOW ? 240 : 480 },
        },
        audio: false,
      }), 12000, "camera-timeout");
      HAND.stream = stream;
      cam.srcObject = stream;
      await cam.play();
      cam.classList.add("on");

      handBtn.textContent = "加载手势模型…";

      const mod = await withTimeout(
        import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"),
        20000, "model-timeout"
      );
      const { FilesetResolver, HandLandmarker } = mod;
      const vision = await withTimeout(
        FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"),
        20000, "model-timeout"
      );

      const opts = {
        baseOptions: { modelAssetPath: "hand_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numHands: 1,
      };
      try {
        HAND.landmarker = await withTimeout(HandLandmarker.createFromOptions(vision, opts), 30000, "model-timeout");
      } catch (e) {
        opts.baseOptions.delegate = "CPU";
        HAND.landmarker = await withTimeout(HandLandmarker.createFromOptions(vision, opts), 30000, "model-timeout");
      }

      HAND.ready = true;
      HAND.on = true;
      handBtn.disabled = false;
      handBtn.classList.add("on");
      handBtn.textContent = "手势已开启";
      if (!auto) toast("张开手掌转动树 · 握拳松开 · 拇指食指捏合点灯", 4600);
      detectLoop();
    } catch (err) {
      console.error(err);
      handBtn.disabled = false;
      handBtn.textContent = "手势控制";
      stopHands();
      if (!auto) {
        const msg = err && err.message;
        if (msg === "camera-timeout") toast("摄像头没有响应。看看是不是被别的程序占用了。");
        else if (msg === "model-timeout") toast("手势模型加载超时。检查网络后再点一次。");
        else if (err && err.name === "NotAllowedError") toast("摄像头被拒绝了。允许权限后再点一次。");
        else if (err && err.name === "NotFoundError") toast("没有找到摄像头。");
        else toast("手势没启动成功。鼠标和触摸照常可用。");
      }
    }
  }

  function stopHands() {
    HAND.on = false;
    HAND.mode = "idle";
    HAND.base = null;
    if (HAND.raf) cancelAnimationFrame(HAND.raf);
    HAND.raf = 0;
    if (HAND.stream) {
      HAND.stream.getTracks().forEach((t) => t.stop());
      HAND.stream = null;
    }
    cam.classList.remove("on");
    cam.srcObject = null;
    handBtn.classList.remove("on");
  }

  function detectLoop() {
    if (!HAND.on) return;
    // 手机每 70ms 检一次就够，桌面 33ms；比每帧都跑省一半电
    const gap = LOW ? 70 : 33;
    const t = performance.now();
    if (cam.readyState >= 2 && t - HAND.lastDetect >= gap && cam.currentTime !== HAND.lastVideoTime) {
      HAND.lastDetect = t;
      HAND.lastVideoTime = cam.currentTime;
      try {
        handleHand(HAND.landmarker.detectForVideo(cam, t));
      } catch (e) { /* 单帧失败不影响 */ }
    }
    HAND.raf = requestAnimationFrame(detectLoop);
  }

  function handleHand(res) {
    const lm = res && res.landmarks && res.landmarks[0];
    if (!lm) { HAND.mode = "idle"; HAND.base = null; return; }

    const wrist = lm[0];
    const mcp = lm[9];
    const scale = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y) || 1e-3;

    // 张开度 = 四指尖到手腕的平均距离 / 手掌长度。
    // 握拳约 1.0，张开约 2.0，和手离镜头多远无关。
    let spread = 0;
    for (const i of [8, 12, 16, 20]) {
      spread += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y);
    }
    const open = (spread / 4) / scale;

    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / scale;

    // 预览是镜像的，所以 x 取反，手往右 → 树往右
    const hx = (0.5 - mcp.x) * 2;
    const hy = (0.5 - mcp.y) * 2;

    if (pinch < 0.34 && open > 1.25 && performance.now() - HAND.lastPinch > 700) {
      HAND.lastPinch = performance.now();
      toggleLight();
    }

    if (open > 1.62) {
      if (HAND.mode !== "steer") {
        HAND.mode = "steer";
        HAND.base = { yaw: yaw, pitch: pitch, hx: hx, hy: hy };
      } else {
        yaw = HAND.base.yaw + (hx - HAND.base.hx) * 2.4;
        pitch = clamp(HAND.base.pitch + (hy - HAND.base.hy) * 0.9, -0.42, 0.62);
      }
      spin = 0;
    } else if (open < 1.24) {
      HAND.mode = "idle";
      HAND.base = null;
    }
  }

  handBtn.addEventListener("click", () => {
    if (!HAND.ready) { enableHands(false); return; }
    if (HAND.on) {
      stopHands();
      handBtn.textContent = "手势控制";
    } else {
      HAND.on = true;
      cam.classList.add("on");
      handBtn.classList.add("on");
      handBtn.textContent = "手势已开启";
      detectLoop();
    }
  });

  // ---------------------------------------------------------------- 启动
  buildTree();
  resize();

  setTimeout(() => hint.classList.add("tame"), 7200);

  // 默认开启手势。file:// 下摄像头本来就不许用，直接跳过；
  // 被拒绝或环境不支持时静默退回按钮，不打扰。
  if (location.protocol !== "file:" && navigator.mediaDevices) {
    setTimeout(() => { if (!HAND.ready && !HAND.on) enableHands(true); }, 700);
  }

  requestAnimationFrame(frame);
})();
</script>
